{% extends "base.html" %}
{% block title %}Add a Book · Little Library{% endblock %}
{% block content %}
  <h1>Add a book to your shelf</h1>
  <p class="intro">Capture the details now; you can rate it whenever you’re ready.</p>
  <form class="form-card" action="{{ url_for('add_book') }}" method="POST">
    <p>
      <label for="isbn">ISBN</label>
      <input type="text" id="isbn" name="isbn" required>
    </p>
    <p>
      <label for="title">Title</label>
      <input type="text" id="title" name="title" required>
    </p>
    <p>
      <label for="publication_year">Publication year</label>
      <input type="number" id="publication_year" name="publication_year" min="1" required>
    </p>
    <p>
      <label for="author_id">Author</label>
      <select id="author_id" name="author_id" required>
        <option value="">Select an author</option>
        {% for author in authors %}
          <option value="{{ author.id }}">{{ author.name }}</option>
        {% endfor %}
      </select>
    </p>
    <p>
      <label for="rating">Rating <span class="muted">(optional, 1–10)</span></label>
      <input type="number" id="rating" name="rating" min="1" max="10">
    </p>
    <button type="submit">Add book</button>
  </form>
{% endblock %}
